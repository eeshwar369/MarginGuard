name: Product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mg_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: marginguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mg_test -d marginguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q --junitxml=artifacts/test-results.xml
      - name: Repeat backend contracts against PostgreSQL
        run: uv run pytest -q --junitxml=artifacts/postgres-tests.xml
        env:
          MG_TEST_DATABASE_URL: postgresql://mg_test:local-test-only@127.0.0.1:5432/marginguard_test
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start server and test product journeys
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/marginguard.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          cd web
          npm run test:e2e
          node check-accessibility.cjs
        env:
          MG_APP_ORIGIN: http://127.0.0.1:8000
          MG_DATABASE_URL: postgresql://mg_test:local-test-only@127.0.0.1:5432/marginguard_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            web/playwright-report/
            web/test-results/
          retention-days: 14
