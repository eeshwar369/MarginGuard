services:
  - type: web
    name: marginguard-genztech
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - README.md
        - docs/**
        - scripts/**
        - tests/**
        - web/tests/**
        - web/check-accessibility.cjs
        - web/record-demo.cjs
        - .env.example
        - render.yaml
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MG_ENV
        value: production
      - key: MG_COOKIE_SECURE
        value: "true"
      - key: MG_DATABASE_URL
        sync: false
      - key: MG_GEMINI_API_KEY
        sync: false
      - key: MG_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MG_ALLOW_REGISTRATION
        value: "true"
      - key: MG_ALLOW_DEMO
        value: "true"
      - key: MG_MAX_ROWS
        value: "10000"
      - key: MG_MAX_UPLOAD_MB
        value: "4"
