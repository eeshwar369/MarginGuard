[project]
name = "marginguard"
version = "1.0.0"
description = "Evidence-backed margin investigations and decision approvals"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20",
  "duckdb>=1.2,<2",
  "langgraph>=1,<2",
  "google-genai>=1,<3",
  "reportlab>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
